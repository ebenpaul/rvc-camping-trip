<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello, world</title>
  <style>
    :root {
      --cream: #F4F1EA;
      --ink: #1F1E1C;
      --muted: #6B6862;
      --clay: #D97757;
      --line: #E5E0D5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cream);
      color: var(--ink);
      font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
      line-height: 1.5;
    }

    .card {
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--clay);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 14px;
      margin-bottom: 28px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.5rem, 8vw, 3.75rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }

    h1 .dot { color: var(--clay); }

    p {
      margin-top: 18px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .rule {
      width: 40px;
      height: 2px;
      background: var(--clay);
      border: none;
      margin: 32px auto 0;
    }

    footer {
      margin-top: 24px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: no-preference) {
      .card { animation: rise 0.6s ease-out both; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Site is live</span>
    <h1>Hello, world<span class="dot">.</span></h1>
    <p>The camping trip page is coming soon. If you're seeing this, the deploy worked.</p>
    <hr class="rule" />
    <footer>Built for the trip &middot; hosted on Cloudflare Pages</footer>
  </main>
</body>
</html>
